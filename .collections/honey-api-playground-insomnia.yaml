    url: "{{ _.baseUrl }}/v1/user"
    name: Update User
    description: >
      This request updates a previously registered user.


      To use this request, you will need a valid loginToken from POST -> /v1/login


      All requests contain data validation, so arbitrary data cannot be sent in the request body.


      List of requirements:


      - nickName
        - Can only contain letters and numbers.
        - Cannot start with number

      - Name
        - Can only contain letters

      - email
        - This field does not exist because the email cannot be updated.

      - password
        - Can contain letters, numbers, and some special characters

      - programmingTime
        - Must be a previously registered value from GET -> /v1/programming-time-options

      - bornData
        - date
          - Must be a valid date
          - Must be today or earlier


      - country
        - Must be a previously registered value from GET -> /v1/countries

      - hobbies
        - Must be a list of previously registered values from GET -> /v1/hobbies
        - Minimum list size is 1
        - Maximum list size is 3


      See possible values in the data search endpoints under Honey API Playground > Data Search.


      A successful request returns HTTP 204 No Content with no response body.


      See the examples in each request for additional response contracts.
    method: PATCH
    body:
      mimeType: application/json
      text: |-
        {
        	"nickName": "newNickName",
        	"name": "newName",
        	"password": "myNewPassword",
        	"programmingTime": "More than 2 years",
        	"bornData": {
        		"date": "2023-01-15",
        		"country": "Australia"
        	},
        	"hobbies": [
        		"Programming",
        		"Watch series",
        		"Ride a bicycle"
        	]
        }
